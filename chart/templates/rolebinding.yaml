{{- if .Values.tailscale.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openclaw-chatgpt-bridge.fullname" . }}-tailscale
subjects:
  - kind: ServiceAccount
    name: {{ include "openclaw-chatgpt-bridge.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openclaw-chatgpt-bridge.fullname" . }}-tailscale
{{- end }}
