{{- if .Values.tailscale.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openclaw-chatgpt-bridge.fullname" . }}-headless
spec:
  clusterIP: None
  selector:
    app: {{ include "openclaw-chatgpt-bridge.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8080
{{- end }}

