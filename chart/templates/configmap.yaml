apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw-chatgpt-bridge.fullname" . }}-config
data:
  PORT: {{ .Values.env.port | quote }}
  ADDR: {{ .Values.env.addr | quote }}
  REQUEST_TIMEOUT_MS: {{ .Values.env.requestTimeoutMs | quote }}
  MAX_BODY_BYTES: {{ .Values.env.maxBodyBytes | quote }}
  OPENCLAW_SESSION_KEY: {{ .Values.env.openclawSessionKey | quote }}
