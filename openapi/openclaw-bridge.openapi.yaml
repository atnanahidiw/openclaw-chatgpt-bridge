openapi: 3.1.0
info:
  title: OpenClaw ChatGPT Bridge
  version: 1.0.0
  description: >
    OpenAPI schema for a Custom GPT Action that calls the bridge service.
servers:
  - url: https://bridge.example.com
security:
  - api_key: []
paths:
  /v1/openclaw:
    post:
      operationId: sendToOpenClawBridge
      summary: Send a task to the OpenClaw bridge
      description: The bridge validates the request and forwards it to OpenClaw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - create_flow
                    - run_task
                    - get_flow
                    - resume_flow
                    - finish_flow
                  description: >
                    OpenClaw operation to perform. create_flow creates a new flow.
                    run_task sends work to an existing flow. get_flow checks status.
                    resume_flow resumes a paused flow. finish_flow closes a flow.
                flowId:
                  type: string
                  description: >
                    Existing OpenClaw flow ID. Required for get_flow, resume_flow,
                    and finish_flow. Usually required for run_task when continuing
                    an existing flow.
                sessionKey:
                  type: string
                  description: >
                    Advisory only, recorded in the bridge log. It is NOT sent to
                    OpenClaw: the webhook route is bound to a session by OpenClaw
                    configuration, so a caller cannot choose one.
                goal:
                  type: string
                  description: >
                    Human-readable project goal. Required for create_flow.
                task:
                  type: string
                  description: >
                    Instruction or message to send to OpenClaw. Required for run_task.
                runtime:
                  type: string
                  enum:
                    - subagent
                    - acp
                  description: >
                    Execution runtime for the child task. Required for run_task.
                childSessionKey:
                  type: string
                  description: >
                    Optional session for the child task created by run_task.
                expectedRevision:
                  type: integer
                  minimum: 0
                  description: >
                    Flow revision the caller expects, for optimistic concurrency.
                    Required for resume_flow and finish_flow. Read the current
                    value from the get_flow response before calling either.
                status:
                  type: string
                  description: >
                    Optional status hint. create_flow accepts queued, running,
                    waiting, or blocked. run_task and resume_flow accept queued or
                    running. get_flow and finish_flow do not accept it.
                notifyPolicy:
                  type: string
                  enum:
                    - done_only
                    - state_changes
                    - silent
                  default: done_only
                  description: >
                    Notification behavior, honored by create_flow and run_task only.
                    done_only sends only final updates. state_changes sends progress
                    events. silent suppresses notifications.
                metadata:
                  type: object
                  additionalProperties: true
                  description: >
                    Free-form annotations. Forwarded as OpenClaw's stateJson on
                    create_flow, resume_flow, and finish_flow; ignored for get_flow
                    and run_task, which do not accept it.
            examples:
              createFlow:
                summary: Create a new OpenClaw flow
                value:
                  action: create_flow
                  goal: Check the deployment status and summarize any errors.
                  notifyPolicy: done_only
                  metadata:
                    source: chatgpt-action
              runTask:
                summary: Run a task in an existing flow
                value:
                  action: run_task
                  flowId: flow_123
                  runtime: subagent
                  task: Continue from the last result and inspect the failed pod logs.
                  notifyPolicy: state_changes
              getFlow:
                summary: Get flow status, and read the revision the next call needs
                value:
                  action: get_flow
                  flowId: flow_123
              resumeFlow:
                summary: Resume a paused flow
                value:
                  action: resume_flow
                  flowId: flow_123
                  expectedRevision: 3
                  status: running
              finishFlow:
                summary: Finish a flow
                value:
                  action: finish_flow
                  flowId: flow_123
                  expectedRevision: 4
      responses:
        "200":
          description: Bridge accepted the request and OpenClaw returned a 2xx.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeSuccess"
        "400":
          description: >
            The body was not a single JSON object, or it failed validation.
            Validation failures list every problem in `details`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
              examples:
                validationFailed:
                  summary: Missing a field the action requires
                  value:
                    ok: false
                    error: invalid request
                    details:
                      - flowId is required for run_task
                      - task is required for run_task
                malformedBody:
                  summary: Body was not a JSON object
                  value:
                    ok: false
                    error: request body must be JSON object
        "405":
          description: Method other than POST.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
        "413":
          description: Body exceeded MAX_BODY_BYTES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
        "500":
          description: Bridge is misconfigured, e.g. OPENCLAW_WEBHOOK_URL is unset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
        "502":
          description: OpenClaw was unreachable or its response could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
        "504":
          description: OpenClaw did not respond within REQUEST_TIMEOUT_MS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
        "401":
          description: >
            The bridge's own API key was missing or wrong. This is the bridge
            rejecting the caller, and is unrelated to the separate secret the
            bridge uses when it talks to OpenClaw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
              examples:
                missingKey:
                  summary: No credential presented
                  value:
                    ok: false
                    error: unauthorized
        default:
          description: >
            OpenClaw returned a non-2xx status and the bridge mirrored it. The
            status is whatever OpenClaw sent, so this set is open: a 401 from
            OpenClaw surfaces here as a 401.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeError"
              examples:
                upstreamRejected:
                  summary: OpenClaw rejected the webhook secret
                  value:
                    ok: false
                    error: OpenClaw returned non-2xx status
                    upstreamStatus: 401
                    upstreamBody:
                      message: unauthorized

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: api_key
      description: >
        Shared secret between the Custom GPT and the bridge, set as BRIDGE_API_KEY
        on the bridge. In the ChatGPT Action builder choose Authentication ->
        API Key -> Auth Type "Custom", and set the custom header name to api_key.
        The bridge also accepts the same value as Authorization: Bearer <key>,
        which is handy for curl.
  schemas:
    UpstreamBody:
      description: >
        OpenClaw response body, passed through unchanged. Parsed JSON when
        OpenClaw replies with application/json, otherwise the raw body as a
        string. Not constrained to an object.

    BridgeSuccess:
      type: object
      additionalProperties: true
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Always true on this response.
        bridge:
          type: string
          description: Bridge service name.
        upstreamStatus:
          type: integer
          description: Status code OpenClaw returned.
        upstreamBody:
          $ref: "#/components/schemas/UpstreamBody"

    BridgeError:
      type: object
      additionalProperties: true
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          description: Always false on error responses.
        error:
          type: string
          description: Short, human-readable reason.
        details:
          type: array
          items:
            type: string
          description: >
            Present only on validation failures. Lists every problem found, not
            just the first, so all of them can be fixed in one retry.
        upstreamStatus:
          type: integer
          description: >
            Present only when the request reached OpenClaw and it replied
            non-2xx.
        upstreamBody:
          $ref: "#/components/schemas/UpstreamBody"
