apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: openclaw-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/your-org/openclaw-chatgpt-bridge:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bridge-config
            - secretRef:
                name: bridge-secrets
          env:
            - name: OPENCLAW_WEBHOOK_URL
              value: "http://openclaw-gateway:18789/plugins/webhooks/gpt"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
